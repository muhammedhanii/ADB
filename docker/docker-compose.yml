version: "3.9"

services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/recipebook
      - PORT=5000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=60
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
      - SERVER_API_BASE_URL=http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
